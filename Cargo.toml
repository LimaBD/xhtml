[package]
name = "xhtml-core"
version = "0.1.0"
edition = "2021"
description = "Rust core for xhtml — fast HTML/XML parser for Python"
license = "MIT"
authors = ["Bruno Lima"]

[lib]
name = "xhtml_core"
path = "native/lib.rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
scraper = "0.19"
ego-tree = "0.6"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
